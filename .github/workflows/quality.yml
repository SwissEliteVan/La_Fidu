name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Install Chromium for visual QA
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/astro-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Smoke core routes
        run: |
          set -e
          for route in / /services/ /services/independants/ /services/pme/ /services/salaires/ /services/tva/ /services/creation-entreprise/ /services/bouclement/ /services/conseil-fiscal/ /tarifs/ /a-propos/ /contact/; do
            curl --fail --silent --show-error "http://127.0.0.1:4321${route}" > /dev/null
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4321/page-inexistante)" = "404"

      - name: Capture responsive screenshots
        run: |
          set -e
          mkdir -p qa
          for route in home services tarifs a-propos contact; do
            case "$route" in
              home) url="/" ;;
              *) url="/$route/" ;;
            esac
            npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="360,900" --full-page "http://127.0.0.1:4321${url}" "qa/${route}-360.png"
            npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="768,1024" --full-page "http://127.0.0.1:4321${url}" "qa/${route}-768.png"
            npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page "http://127.0.0.1:4321${url}" "qa/${route}-1440.png"
          done

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: |
            qa/*.png
            package-lock.json
          if-no-files-found: error
